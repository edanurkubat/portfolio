<!doctype html>
<html lang="tr" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      if ('scrollRestoration' in history) {
        history.scrollRestoration = 'manual';
      }
    </script>
    <title>Proje Detayı | Edanur Kubat</title>
    <link rel="icon" type="image/svg+xml" href="/public/favicon.svg" />
    <link rel="apple-touch-icon" href="/public/favicon.svg" />
    <meta name="theme-color" content="#0f172a" />
    <script>
      (function () {
        var theme = localStorage.getItem("theme") || "dark";
        if (theme === "dark") document.documentElement.classList.add("dark");
      })();
    </script>
    
    <link rel="stylesheet" href="./src/assets/styles/output.css" />
  </head>
  <body
    class="bg-white text-slate-900 dark:bg-slate-900 dark:text-slate-50 font-sans antialiased selection:bg-cyan-500 selection:text-slate-900 transition-colors duration-300"
  >
    <header
      class="fixed top-0 left-0 w-full z-50 bg-white/80 dark:bg-slate-900/80 backdrop-blur-md border-b border-slate-200 dark:border-slate-800"
    >
      <nav
        class="max-w-6xl mx-auto px-6 h-16 flex items-center justify-between"
      >
        <a
          href="index.html"
          class="text-xl font-bold tracking-tight text-cyan-600 dark:text-cyan-400"
        >
          DEV<span class="text-slate-900 dark:text-slate-100">.PORTFOLIO</span>
        </a>
        <div class="flex items-center gap-3">
          <button
            id="theme-toggle"
            type="button"
            role="switch"
            aria-checked="true"
            class="relative w-11 h-6 rounded-full bg-slate-300 dark:bg-slate-700 transition-colors duration-300"
            aria-label="Temayı Değiştir"
          >
            <span
              id="theme-toggle-knob"
              class="absolute top-0.5 left-0.5 w-5 h-5 rounded-full bg-white dark:bg-cyan-400 shadow-md transition-transform duration-300 dark:translate-x-5"
            ></span>
          </button>
          <button
            id="lang-toggle"
            class="text-xs font-semibold px-3 py-1.5 rounded-md border border-slate-200 dark:border-slate-700 text-slate-600 dark:text-slate-300 hover:border-cyan-500 hover:text-cyan-400 transition-colors"
            aria-label="Dili Değiştir"
          >
            <span id="lang-toggle-label">EN</span>
          </button>
        </div>
      </nav>
    </header>

    <main class="max-w-6xl mx-auto px-6 pt-28 pb-16">
      <div id="project-detail"></div>
    </main>

    <script type="module" src="./src/js/project.js"></script>
  </body>
</html>
